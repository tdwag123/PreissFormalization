name: Check Lean statements and axioms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Check source policy and generate declaration audit
        id: targets
        run: |
          python scripts/test_source_checks.py
          python scripts/check_blueprint.py
          python scripts/lean_targets.py --github-output >> "$GITHUB_OUTPUT"
      - name: Compile pinned upstream and all current project libraries
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: ${{ steps.targets.outputs.modules }}
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Inspect actual compiled axiom dependencies
        shell: bash
        run: |
          set -o pipefail
          lake env lean tmp/blueprint_checks.lean | tee tmp/blueprint-kernel.log
          python scripts/check_kernel_axioms.py tmp/blueprint-kernel.log
      - name: Preserve kernel status and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-kernel-status
          path: |
            tmp/kernel-status.json
            tmp/blueprint-kernel.log
          if-no-files-found: ignore
